name: CI

on:
  pull_request:
  push:
    branches: [main]

# A force-push should cancel the superseded run rather than queue behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The gate executes PR-supplied code (checkout + build); default to read-only
# so a compromised or malicious PR can't use the job's token to write back.
permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Flutter's Android build needs a JDK; the runner's default is not guaranteed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # --enforce-lockfile: fail on lockfile drift instead of silently resolving
      # something newer. This is why pubspec.lock is committed.
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # Generated code is gitignored, so it must be produced before analyze.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      # A golden diff nobody can look at is nearly impossible to act on.
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures
          retention-days: 7
          if-no-files-found: ignore

      - name: Build web
        run: flutter build web --release

      - name: Build APK (dev flavor)
        run: |
          # A retry only helps transient failures -- a genuine compile error
          # still fails all 3 attempts, just after two extra ~2-minute no-op
          # Gradle starts. Accepted trade: the Gradle wrapper's distribution
          # download (org.gradle.wrapper.Download) has flaked 4x today.
          for attempt in 1 2 3; do
            flutter build apk --flavor dev --debug && break
            if [ "$attempt" = "3" ]; then
              echo "APK build failed after 3 attempts"; exit 1
            fi
            echo "APK build attempt $attempt failed (transient Gradle-distribution downloads have failed 4x today); retrying in 20s"
            sleep 20
          done

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: apk-dev-debug
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The campaign_service test suite against a real Postgres 16 service
  # container -- Task 11's acceptance criterion depends on this backend being
  # real and proven, not just unit-tested in isolation (spec §9).
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campaign
          POSTGRES_PASSWORD: campaign
          POSTGRES_DB: campaign
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://campaign:campaign@localhost:5432/campaign
      JWT_SECRET: ci-secret-at-least-32-characters-long!!
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with: { sdk: '3.12.2' }

      - run: dart pub get
        working-directory: packages/campaign_contracts
      - run: dart test
        working-directory: packages/campaign_contracts
      - run: dart analyze --fatal-infos
        working-directory: packages/campaign_contracts

      - run: dart pub get
        working-directory: server
      - run: dart format --output=none --set-exit-if-changed .
        working-directory: server
      - run: dart analyze --fatal-infos
        working-directory: server

      # test/contract/parity_test.dart launches tool/mock_server as a
      # subprocess via a bare `dart run`, which resolves dependencies
      # implicitly on first run if they aren't already -- on a cold runner
      # that resolution can eat into the test's own 30x1s health-poll budget
      # and flake. Resolving here, once, up front removes that risk.
      - run: dart pub get
        working-directory: tool/mock_server

      - run: dart test
        working-directory: server

  # ---------------------------------------------------------------------------
  # Maestro E2E on an Android emulator. A green `e2e` is Epic P0.5's hard exit
  # criterion; it reverses T-0.1.4's recorded "cancelled, not deferred".
  #
  # WHY A MATRIX, and not one APK running --include-tags=android:
  # every per-flow setting the suite needs (ROLE, QUALITY, SEED, LOCALE) is read
  # through `const String.fromEnvironment`, which is resolved at COMPILE time.
  # The flows used to pass those names via Maestro `launchApp: arguments:`, which
  # sends Android *intent extras* at RUNTIME. Nothing bridges the two:
  # MainActivity.kt is a bare five-line FlutterActivity and there is no
  # MethodChannel or getIntent().getExtras() anywhere in the repo. So those
  # arguments were inert from the day they were written, and a single-APK run
  # takes AppConfig's defaults — which fails crm_case_decision and
  # crm_case_conflict (/forbidden, no verificationDecide), field_capture_recapture
  # (never enters the recapture path) and offline_queue_retry (empty queue).
  # One APK per distinct dart-define set is what gives each flow the
  # configuration its assertions already assume.
  #
  # Flows are named by FILE, never by tag. `--include-tags=android` is a trap
  # here: field_offline_capture is tagged `field, critical, offline` with no
  # `android` tag, yet §3.5 makes offline flows Android-only, so a tag filter
  # would silently skip the highest-value flow in the suite.
  e2e:
    name: e2e (${{ matrix.config.key }})
    runs-on: ubuntu-latest
    # Only after the gate passes: booting an emulator to test code that does
    # not compile wastes ~15 minutes per run.
    needs: gate
    timeout-minutes: 45
    # Audit finding (Task 11, do not remove): this job had no Postgres before
    # the cut-over. The mock server was purely in-memory; the real
    # campaign_service it replaces below is not, and needs the exact same
    # service container the `server` job uses.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campaign
          POSTGRES_PASSWORD: campaign
          POSTGRES_DB: campaign
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://campaign:campaign@localhost:5432/campaign
      JWT_SECRET: ci-secret-at-least-32-characters-long!!
      # /__test__/* only exists because of this -- see server/lib/src/app.dart
      # and server/lib/src/seed/seed_routes.dart. Never set this outside CI.
      ENABLE_TEST_SEEDING: 'true'
      # Staged cut-over (spec §9, amended): each config runs against the real
      # service UNLESS its own `matrix.config.useMock` says otherwise -- see
      # the matrix below for which configs need the mock and why. The repo/
      # environment variable E2E_USE_MOCK (Settings -> Secrets and variables
      # -> Actions -> Variables), when set, overrides EVERY config at once,
      # for bisecting a red run without editing this file. Kept as a flag
      # rather than deleted the moment the cut-over landed -- the mock is
      # still the harness two epics of E2E coverage were built against, and
      # `field` depends on it for real in this staged plan, not just as a
      # fallback (`crm` cut over to the real service in sub-project 5a).
      USE_MOCK: ${{ vars.E2E_USE_MOCK || matrix.config.useMock }}
    strategy:
      # One red configuration must not mask the state of the other four.
      fail-fast: false
      matrix:
        config:
          # Staged cut-over (spec §9, amended after Task 11's fix-round review):
          # each config's `useMock` reflects whether ITS OWN flows depend on
          # endpoints this slice's real service actually implements
          # (/health, /auth/*, /campaigns only) -- traced flow by flow, not
          # guessed. `recapture` and `queue` pass against the real service
          # (their assertions don't need a successful upload: `queue` even
          # asserts the retry FAILS, and a 404 presign produces exactly
          # that). `locale` needs E2E_REAL_AUTH now: its second half reads
          # /campaigns, and FakeAuthService's non-JWT token is correctly
          # 401'd by the real authenticate() -- see
          # .maestro/flows/locale_bengali.yaml's updated header comment.
          #
          # Defaults (ROLE=field_user, QUALITY=pass, no SEED). field_offline_capture
          # belongs HERE and not under `queue`: SEED=queue seeds a pending task and
          # this flow asserts an exact pending count of one (e2e_seeder.dart:51).
          - key: field
            defines: ''
            useMock: '1' # field_offline_capture asserts a successful upload
            # completing (Match processing), which needs /media/presign,
            # /media/upload/<id> and /attendance/<id>/confirm -- endpoints
            # that belong to sub-project 4/5's slice and don't exist yet.
            # Move this config off USE_MOCK when they land.
            flows: >-
              .maestro/flows/carpenter_search_confirm.yaml
              .maestro/flows/field_online_capture.yaml
              .maestro/flows/field_offline_capture.yaml
          # 5a: real-auth crm_verifier signs in for real, opens the seeded
          # CASE_E2E/CASE_CONFLICT cases, and drives approve / conflict
          # (412 on an already-decided case) against the real
          # campaign_service. Acceptance proof for sub-project 5a.
          - key: crm
            defines: '--dart-define=E2E_REAL_AUTH=true --dart-define=ROLE=crm_verifier'
            useMock: '0'
            flows: >-
              .maestro/flows/crm_case_decision.yaml
              .maestro/flows/crm_case_conflict.yaml
          # failFirst is process-wide, so this cannot share an APK with a flow
          # that expects its first capture to pass.
          - key: recapture
            defines: '--dart-define=QUALITY=fail'
            useMock: '0'
            flows: .maestro/flows/field_capture_recapture.yaml
          - key: queue
            defines: '--dart-define=SEED=queue'
            useMock: '0'
            flows: .maestro/flows/offline_queue_retry.yaml
          # Its own APK because every other flow falls back to English
          # visible-text selectors and would break against a Bengali build.
          # E2E_REAL_AUTH=true added in the fix round: the flow's second half
          # reads /campaigns, which the real authenticate() 401s for
          # FakeAuthService's non-JWT token -- see the flow's own header
          # comment for the seeded field_user login this now performs first.
          - key: locale
            defines: '--dart-define=LOCALE=bn --dart-define=E2E_REAL_AUTH=true'
            useMock: '0'
            flows: .maestro/flows/locale_bengali.yaml
          # D3 / Task 11 step 6: signs in through the REAL identity provider
          # (DioAuthService) instead of FakeAuthService -- see
          # providers.dart's authServiceProvider and
          # real_auth_campaign_journey.yaml's own header comment. `locale`
          # above does too now (added in the fix round), for its own
          # unrelated reason.
          - key: realAuth
            defines: '--dart-define=E2E_REAL_AUTH=true'
            useMock: '0'
            flows: .maestro/flows/real_auth_campaign_journey.yaml
          # 2a-I: real-auth login, master search/basket, register, and the
          # same-visit profile-request -> basket path -- the acceptance proof
          # for sub-project 2a (identity & registrations). See
          # registration_workspace.yaml's own header comment.
          - key: registration
            defines: '--dart-define=E2E_REAL_AUTH=true'
            useMock: '0'
            flows: .maestro/flows/registration_workspace.yaml
          # 2b-I: real-auth login, open the seeded campaign's bulk import,
          # inject the bundled CSV (FakeFileSource, no native picker), poll the
          # async classify to "Ready to commit", commit -> "Import completed."
          # -- the acceptance proof for sub-project 2b (async bulk import).
          # See bulk_import.yaml's own header comment. Also piloted on Maestro
          # Cloud in the e2e-cloud job below (non-blocking).
          - key: bulkImport
            defines: '--dart-define=E2E_REAL_AUTH=true'
            useMock: '0'
            flows: .maestro/flows/bulk_import.yaml
          # 3a: real-auth login, open the seeded APPROVED campaign's Sessions
          # tab, and drive start -> pause -> resume -> close against the real
          # campaign_service. Acceptance proof for sub-project 3a.
          - key: sessionOps
            defines: '--dart-define=E2E_REAL_AUTH=true'
            useMock: '0'
            flows: .maestro/flows/session_ops.yaml
          # 4a: real-auth field_user capture round-trip (presign -> upload ->
          # confirm) against the real campaign_service. Acceptance proof for
          # sub-project 4a. The `field` config keeps the mock until 4c migrates
          # field_capture_recapture.
          - key: capture
            defines: '--dart-define=E2E_REAL_AUTH=true --dart-define=ROLE=field_user'
            useMock: '0'
            flows: .maestro/flows/attendance_capture.yaml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      # Generated code is gitignored, so it must be produced before the build.
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The backend the emulator reaches at 10.0.2.2:8080. Defaults to the
      # REAL campaign_service -- server/bin/server.dart, migrating and
      # listening against the job's `services.postgres` container above --
      # which is this task's whole acceptance criterion (spec §9): a real,
      # non-in-memory backend behind the unchanged client. USE_MOCK (job env,
      # above) falls back to tool/mock_server for bisection.
      #
      # Started BEFORE the emulator and left running, and polled rather than
      # slept on, so a backend that fails to start fails here with a clear
      # message instead of as every flow in this config mysteriously red.
      # `run_maestro_flows.sh` is what resets the real backend's fixtures
      # before each flow; this step only gets it up once.
      - name: Start the backend
        run: |
          if [ "$USE_MOCK" = "1" ]; then
            cd tool/mock_server
            dart pub get
            nohup dart run bin/server.dart > "$RUNNER_TEMP/backend.log" 2>&1 &
            ready_url="http://127.0.0.1:8080/campaigns"
          else
            cd server
            dart pub get
            nohup dart run bin/server.dart > "$RUNNER_TEMP/backend.log" 2>&1 &
            ready_url="http://127.0.0.1:8080/health"
          fi
          for i in $(seq 1 30); do
            if curl -fsS "$ready_url" > /dev/null; then
              echo "backend up ($ready_url)"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not come up:"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # Built outside the emulator step so a compile failure is not charged to
      # emulator wall-clock, and so the artifact path is asserted before boot.
      #
      # 10.0.2.2 is how an Android emulator reaches the host loopback. The dev
      # debug build permits cleartext to it via android/app/src/debug/
      # AndroidManifest.xml; release builds keep Android's secure default.
      - name: Build the ${{ matrix.config.key }} APK
        run: |
          # A retry only helps transient failures -- a genuine compile error
          # still fails all 3 attempts, just after two extra ~2-minute no-op
          # Gradle starts. Accepted trade: the Gradle wrapper's distribution
          # download (org.gradle.wrapper.Download) has flaked 4x today.
          for attempt in 1 2 3; do
            flutter build apk --debug --flavor dev \
              --dart-define=E2E=true \
              --dart-define=API_BASE_URL=http://10.0.2.2:8080 \
              ${{ matrix.config.defines }} && break
            if [ "$attempt" = "3" ]; then
              echo "APK build failed after 3 attempts"; exit 1
            fi
            echo "APK build attempt $attempt failed (transient Gradle-distribution downloads have failed 4x today); retrying in 20s"
            sleep 20
          done
          # The gate job already uploads this exact path with
          # `if-no-files-found: error`, so it is confirmed for a plain
          # `--flavor dev --debug`; assert it again here because --dart-define
          # does not change the output name and a silent rename would otherwise
          # surface as an `adb install` failure 15 minutes later.
          ls -l build/app/outputs/flutter-apk/app-dev-debug.apk

      # KVM lets the emulator run with hardware acceleration; without it a
      # cold boot on a hosted runner is slow enough to hit the timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the ${{ matrix.config.key }} flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          # This action runs `script:` LINE BY LINE, each in its own `sh -c`, so
          # a multi-line for/if cannot work here and variables do not survive
          # between lines. The first run of this job died in all five configs
          # with `Syntax error: end of file unexpected (expecting "done")`
          # because `do` and `done` landed in different shells. The loop
          # therefore lives in a script file, invoked as one line; it also
          # attempts every flow rather than stopping at the first red one,
          # because a ~15-minute emulator boot is too expensive to spend
          # discovering red flows one at a time.
          script: |
            adb install -r build/app/outputs/flutter-apk/app-dev-debug.apk
            sh tool/scripts/run_maestro_flows.sh ${{ matrix.config.flows }}

      # A red E2E run that leaves nothing to inspect is nearly impossible to
      # act on — the same reason the gate uploads golden diffs. Maestro records
      # a screenshot and view hierarchy per step under ~/.maestro/tests.
      - name: Upload Maestro output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output-${{ matrix.config.key }}
          path: ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

      # The flows depend on this backend; when one fails "for no reason" its
      # log is the first thing to read.
      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.config.key }}
          path: ${{ runner.temp }}/backend.log
          retention-days: 7
          if-no-files-found: ignore

  # Maestro Cloud pilot (user-requested, 2026-08-13). Runs the bulk_import flow
  # on Maestro's remote device farm instead of a GitHub-hosted emulator — the
  # emulator's ANR/viewport/boot flakes cost many reruns during 2a. Because the
  # devices are REMOTE, they cannot reach the campaign_service on the runner
  # (10.0.2.2 / localhost mean nothing off-box), so a cloudflared quick tunnel
  # publishes the runner's seeded service at a public HTTPS URL the device
  # reaches, and the APK is built to point API_BASE_URL at that URL.
  #
  # continue-on-error: this is a PILOT. The emulator `e2e (bulkImport)` config
  # above is the blocking acceptance gate for 2b; a Cloud hiccup (tunnel, quota,
  # device availability) must not block merge while the approach is proven out.
  # Flip to blocking and drop the emulator bulkImport entry once it's reliable.
  e2e-cloud:
    name: e2e-cloud (bulkImport)
    runs-on: ubuntu-latest
    needs: gate
    continue-on-error: true
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campaign
          POSTGRES_PASSWORD: campaign
          POSTGRES_DB: campaign
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://campaign:campaign@localhost:5432/campaign
      JWT_SECRET: ci-secret-at-least-32-characters-long!!
      ENABLE_TEST_SEEDING: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Start the real campaign_service
        run: |
          cd server
          dart pub get
          nohup dart run bin/server.dart > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health > /dev/null; then
              echo "backend up"; exit 0
            fi
            sleep 1
          done
          echo "backend did not come up:"; cat "$RUNNER_TEMP/backend.log"; exit 1

      - name: Start a cloudflared tunnel to the backend
        run: |
          # Quick tunnel (no account needed): publishes localhost:8080 at a
          # random https://<slug>.trycloudflare.com the remote device reaches.
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared
          nohup ./cloudflared tunnel --url http://localhost:8080 --no-autoupdate \
            > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          # The URL is printed to the log asynchronously; poll for it.
          for i in $(seq 1 30); do
            url=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1)
            if [ -n "$url" ]; then
              echo "TUNNEL_URL=$url" >> "$GITHUB_ENV"
              echo "tunnel up: $url"
              exit 0
            fi
            sleep 1
          done
          echo "tunnel did not come up:"; cat "$RUNNER_TEMP/tunnel.log"; exit 1

      - name: Seed fixtures through the tunnel
        run: |
          # One reset is enough: bulk_import is a single flow, so there is no
          # concurrent-flow-vs-one-backend contention the sequential emulator
          # runner's per-flow reset guards against.
          for i in $(seq 1 15); do
            if curl -fsS -X POST "$TUNNEL_URL/__test__/reset" > /dev/null; then
              echo "reset ok"; exit 0
            fi
            sleep 2
          done
          echo "reset via tunnel failed"; exit 1

      - name: Build the bulkImport APK pointing at the tunnel
        run: |
          flutter build apk --debug --flavor dev \
            --dart-define=E2E=true \
            --dart-define=E2E_REAL_AUTH=true \
            --dart-define=API_BASE_URL=$TUNNEL_URL
          ls -l build/app/outputs/flutter-apk/app-dev-debug.apk

      - name: Run bulk_import on Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v2.0.2
        with:
          api-key: ${{ secrets.MAESTRO_API_KEY }}
          project-id: ${{ secrets.MAESTRO_PROJECT_ID }}
          app-file: build/app/outputs/flutter-apk/app-dev-debug.apk
          workspace: .maestro
          include-tags: bulk_import
          # The flow's `appId: ${APP_ID}` needs this at run time (the emulator
          # path passes it via run_maestro_flows.sh --env). If v2.0.2 does not
          # accept `env`, the first CI run reveals it and we hardcode the dev
          # applicationId in a Cloud-specific flow copy instead.
          env: |
            APP_ID=com.acsl.campaign.dev

      - name: Upload tunnel + backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-logs
          path: |
            ${{ runner.temp }}/tunnel.log
            ${{ runner.temp }}/backend.log
          retention-days: 7
          if-no-files-found: ignore
