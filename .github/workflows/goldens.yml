name: goldens

# Manual only. Baselines cannot be generated on the development machine --
# there is no Linux Flutter toolchain there -- so this job produces them on the
# same runner that verifies them, and uploads them for a human to commit.
# It deliberately does NOT write to the repository: the gate stays read-only,
# so a pull request can never make CI commit on its behalf.
on:
  workflow_dispatch:
  # TEMPORARY, removed in the commit that lands the baselines. `workflow_dispatch`
  # is only exposed for workflows that exist on the default branch, and `main`
  # has no `.github/` at all yet -- so the first baselines cannot be produced by
  # dispatch. Once `.github/` reaches `main`, dispatch works and both blocks below
  # must go: an automatic `--update-goldens` would silently regenerate baselines
  # on every commit, which defeats the entire point of having them.
  #
  # The `push` block was added first and never fired -- GitHub never registered
  # this workflow at all (`gh workflow list` shows only CI and Copilot, and the
  # API 404s on goldens.yml "not found on the default branch"). `pull_request` is
  # the trigger that demonstrably does work on this branch, since it is how the
  # CI workflow runs here. Both are kept until baselines actually land.
  #
  # Both are scoped by `paths` to this file, so they are self-limiting: the job
  # can only fire on a commit that edits the workflow itself, never on ordinary
  # product changes.
  push:
    branches: [feat/campaign-management-flutter-scaffold]
    paths:
      - '.github/workflows/goldens.yml'
  pull_request:
    paths:
      - '.github/workflows/goldens.yml'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  update:
    name: regenerate golden baselines
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Regenerate baselines
        run: flutter test test/golden --update-goldens

      - uses: actions/upload-artifact@v4
        with:
          name: golden-baselines
          path: test/golden/goldens
          retention-days: 14
          if-no-files-found: error
