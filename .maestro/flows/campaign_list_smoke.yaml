# W-02 smoke (web — Maestro web support is experimental; see plan §9.4).
# Verifies the three designed data states render. Prereq: mock /campaigns with
# toggleable fixtures (empty | error | rows) via the mock server.
appId: ${APP_ID}
tags:
  - web
  - smoke
---
- clearState
- launchApp:
    arguments:
      E2E: true
      LOCALE: en
      ROLE: campaign_creator
      CAMPAIGNS_FIXTURE: rows # rows | empty | error
- tapOn:
    id: "dev_open_campaigns"

# Data state: table headers + a known seeded row.
- assertVisible: "Campaign"
- assertVisible: "Status"
- assertVisible: "Verified"
- assertVisible: "ACSL Pilot Carpenter Drive" # seeded row

# NOTE: empty ("No campaigns in scope...") and error ("Couldn't load
# campaigns." + Retry) states are exercised by re-launching with
# CAMPAIGNS_FIXTURE=empty and =error respectively. Keep those as separate
# runs rather than mutating state mid-flow.
