# M-02: the mandatory second identity cue gates progress to capture, and
# short queries return nothing. Guards against capturing the wrong carpenter.
#
# Requires the `field` matrix APK (E2E=true with the DEFAULT ROLE=field_user).
# Configuration comes from the build: Maestro `arguments:` are Android intent
# extras and CANNOT reach `const String.fromEnvironment`. See ci.yml's e2e
# matrix. Runs with no mock server — search reads the locally seeded roster.
appId: ${APP_ID}
tags:
  - field
  - android
---
- runFlow: ../subflows/launch_as_field_user.yaml
- tapOn:
    id: "dev_open_search"

# Below the 2-char minimum: no results shown.
- tapOn:
    id: "search_field"
- inputText: "k"
- assertNotVisible:
    id: "search_result"

# Valid query returns matches.
- inputText: "ar" # now "kar"
- assertVisible:
    id: "search_result"
- tapOn:
    id: "search_result"
    index: 0

# Confirm sheet: Continue is disabled until the cue is acknowledged.
- assertVisible:
    id: "confirm_continue"
    enabled: false
- tapOn:
    id: "confirm_ack"
- assertVisible:
    id: "confirm_continue"
    enabled: true
- tapOn:
    id: "confirm_continue"

# Landed on the capture purpose notice for the chosen carpenter.
- assertVisible: "Attendance photo and identity verification"
