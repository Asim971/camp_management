# P-06 concurrency (§9.4): if another reviewer already decided, the server
# returns 409 and the UI must surface it and reload — never silently overwrite.
# Prereq: mock returns 409 for CASE_CONFLICT's decision endpoint.
#
# Requires the `crm` matrix APK (--dart-define=ROLE=crm_verifier) via
# launch_as_crm.yaml. Maestro `arguments:` are Android intent extras and CANNOT
# reach `const String.fromEnvironment`, so the role lives in the build; with the
# default field_user the session has no `verificationDecide` and the route
# redirects to /forbidden. See ci.yml's e2e matrix.
appId: ${APP_ID}
tags:
  - crm
  - android
---
- runFlow: ../subflows/launch_as_crm.yaml
- tapOn:
    id: "dev_open_crm_case_conflict" # opens /verification/cases/CASE_CONFLICT
- assertVisible: "Verification case"

# The Decision card sits BELOW THE FOLD on a phone-profile emulator, and `tapOn`
# does not scroll to find an element by id, so scroll to it first.
- scrollUntilVisible:
    element:
      id: "crm_outcome_approved"
    direction: DOWN
- tapOn:
    id: "crm_outcome_approved"
# crm_reason sits below the radios and was 'Element not found' on CI's api-34
# emulator while visible on a larger local device — so scroll to each element
# rather than assuming the previous scroll left it on screen.
- scrollUntilVisible:
    element:
      id: "crm_reason"
    direction: DOWN
- tapOn:
    id: "crm_reason"
- inputText: "Face matches."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "crm_submit"
    direction: DOWN
- tapOn:
    id: "crm_submit"

# Concurrent-decision handling: informative message + reload, no overwrite.
# Wrapped in `.*`: Maestro anchors text patterns, and this message is rendered
# inside a merged banner node rather than as a standalone text node.
- assertVisible: ".*Another reviewer already decided. Reloaded..*"
