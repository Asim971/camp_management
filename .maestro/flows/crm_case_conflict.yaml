# P-06 concurrency (§9.4): if another reviewer already decided, the server
# returns 412 (a stale/closed If-Match) and the UI must surface it and
# reload — never silently overwrite.
# Prereq: POST /__test__/reset seeds CASE_CONFLICT already decided
# (status=APPROVED, version=2) on the real service, so the CRM client's
# decision -- sent with the version it just fetched via If-Match -- fails the
# server's CAS (`... WHERE version = @ifMatch AND status = 'CRM_REVIEW'`) on
# the status guard, not the version, and the route answers 412
# PRECONDITION_FAILED. See server/lib/src/seed/seed_routes.dart's
# `_seedVerificationFixture` and verification_repo.dart's `decide`.
#
# Requires the `crm` matrix APK (--dart-define=E2E_REAL_AUTH=true
# --dart-define=ROLE=crm_verifier, useMock 0): RouteGuards redirect an
# unauthenticated session to /login, so this signs in for real as
# crm_verifier (who holds verification_decide + sensitive_media_view) rather
# than using ../subflows/launch_as_crm.yaml (that subflow is FakeAuth-only
# and skips /login entirely; with the default field_user the session has no
# verificationDecide and the route redirects to /forbidden). See ci.yml's e2e
# matrix, `crm` entry.
appId: ${APP_ID}
tags:
  - crm
  - android
---
- clearState
- launchApp

- assertVisible:
    id: "login_username"
- tapOn:
    id: "login_username"
- inputText: "crm_verifier"
- tapOn:
    id: "login_password"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "login_submit"

- assertVisible:
    id: "dev_launcher"
- tapOn:
    id: "dev_open_crm_case_conflict" # opens /verification/cases/CASE_CONFLICT
- assertVisible: "Verification case"

# The Decision card sits BELOW THE FOLD on a phone-profile emulator, and `tapOn`
# does not scroll to find an element by id, so scroll to it first.
- scrollUntilVisible:
    element:
      id: "crm_outcome_approved"
    direction: DOWN
- tapOn:
    id: "crm_outcome_approved"
# crm_reason sits below the radios and was 'Element not found' on CI's api-34
# emulator while visible on a larger local device — so scroll to each element
# rather than assuming the previous scroll left it on screen.
- scrollUntilVisible:
    element:
      id: "crm_reason"
    direction: DOWN
- tapOn:
    id: "crm_reason"
- inputText: "Face matches."
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "crm_submit"
    direction: DOWN
- tapOn:
    id: "crm_submit"

# Concurrent-decision handling: informative message + reload, no overwrite.
# The client maps BOTH a 409 and this real service's 412 to the same conflict
# banner, so the visible behaviour is unchanged from the mock-backed version
# of this flow.
# Wrapped in `.*`: Maestro anchors text patterns, and this message is rendered
# inside a merged banner node rather than as a standalone text node.
- assertVisible: ".*Another reviewer already decided. Reloaded..*"
