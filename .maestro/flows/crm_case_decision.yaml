# C-02: machine recommendation is shown as a separate advisory block, and a
# valid decision is recorded (part of P-06). A reason is OPTIONAL for approve
# (this flow fills one in anyway, to exercise crm_reason on the happy path)
# but REQUIRED for reject/return/escalate — that reason-required gating is
# covered by the widget tests and the recapture e2e flow, not here.
# Prereq: POST /__test__/reset seeds CASE_E2E (CRM_REVIEW, MEDIUM band,
# evidence + reference photo) on the real service -- see
# server/lib/src/seed/seed_routes.dart's `_seedVerificationFixture`.
#
# Requires the `crm` matrix APK (--dart-define=E2E_REAL_AUTH=true
# --dart-define=ROLE=crm_verifier, useMock 0): RouteGuards redirect an
# unauthenticated session to /login, so this signs in for real as
# crm_verifier (who holds verification_decide + sensitive_media_view) rather
# than using ../subflows/launch_as_crm.yaml (that subflow is FakeAuth-only
# and skips /login entirely; with the default field_user the session has no
# verificationDecide and the route redirects to /forbidden). See ci.yml's e2e
# matrix, `crm` entry.
appId: ${APP_ID}
tags:
  - cloud_decision
  - crm
  - critical
  - android
  - pr-smoke
---
- clearState
- launchApp

- assertVisible:
    id: "login_username"
- tapOn:
    id: "login_username"
- inputText: "crm_verifier"
- tapOn:
    id: "login_password"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "login_submit"

- assertVisible:
    id: "dev_launcher"
- tapOn:
    id: "dev_open_crm_case" # opens /verification/cases/CASE_E2E
- assertVisible: "Verification case"

# Evidence + the clearly-separated advisory block are both present.
#
# Wrapped in `.*` because Flutter merges each non-interactive SECTION into one
# semantics node and Maestro ANCHORS text patterns. The nodes here are
#   "Evidence\nCaptured\nImage unavailable\nVerified profile photo\n..."
#   "Machine recommendation (advisory)\n• Landmark alignment within tolerance"
# so the bare headings matched nothing. The parentheses are escaped because
# these patterns are regexes, not literals.
- assertVisible: ".*Evidence.*"
# scrollUntilVisible, not assertVisible: the advisory block is BELOW THE FOLD on
# CI's api-34 emulator even though it is on screen on a larger local device, so
# a bare assertion here passes locally and times out in CI. scrollUntilVisible
# still fails if the element never appears, so this is an assertion too — just a
# viewport-independent one. Every below-the-fold element in this flow is reached
# the same way for the same reason.
- scrollUntilVisible:
    element:
      text: ".*Machine recommendation \\(advisory\\).*"
    direction: DOWN

# Approve needs no reason at all — Submit goes enabled as soon as an outcome
# is chosen (reason-required gating for reject/return/escalate is covered by
# the widget tests and the recapture e2e flow, not here).
#
# The Decision card sits BELOW THE FOLD on a phone-profile emulator (the
# failure screenshot shows it just cut off under the advisory block), and
# `tapOn` does not scroll to find an element by id — so scroll to it first.
- scrollUntilVisible:
    element:
      id: "crm_outcome_approved"
    direction: DOWN
- tapOn:
    id: "crm_outcome_approved" # radio "Approve"
# The Decision card runs radios -> reason -> submit (crm_case_screen.dart:296,
# 308, 327) and is TALLER than CI's api-34 viewport, so each element needs its
# own scroll to reach it.
- scrollUntilVisible:
    element:
      id: "crm_submit"
    direction: DOWN
# UP: the reason field sits ABOVE the button we just scrolled down to. A
# reason is optional for approve, but entering one here still exercises the
# field and matches what a verifier would typically do in practice.
- scrollUntilVisible:
    element:
      id: "crm_reason"
    direction: UP
- tapOn:
    id: "crm_reason"
- inputText: "Face matches the verified profile photo."
# The keyboard raised by inputText can cover the button on a short viewport, so
# scroll again rather than assuming the earlier scroll still holds.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "crm_submit"
    direction: DOWN
- assertVisible:
    id: "crm_submit"
    enabled: true
- tapOn:
    id: "crm_submit"
- assertVisible: "Decision recorded"
