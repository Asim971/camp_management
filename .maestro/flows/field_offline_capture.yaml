# P-05 Offline attendance: capture while offline -> queued -> survives restart
# -> syncs on reconnect. The highest-value field flow. Android only (airplane).
#
# Requires the `field` matrix APK (E2E=true with the DEFAULT ROLE=field_user,
# QUALITY=pass and NO SEED). It must NOT run on the `queue` APK: SEED=queue
# seeds a pending task, and this flow asserts an exact pending count of one.
# e2e_seeder.dart:51 states that constraint at the seed site — "only when
# requested (SEED=queue), so capture flows that assert an exact pending count
# aren't polluted".
#
# Maestro `arguments:` are Android intent extras and CANNOT reach
# `const String.fromEnvironment`, so configuration lives in the build.
# See ci.yml's e2e matrix.
appId: ${APP_ID}
tags:
  - field
  - critical
  - offline
  - android
---
- runFlow: ../subflows/launch_as_field_user.yaml

# Go offline BEFORE capture.
- setAirplaneMode: enabled

- tapOn:
    id: "dev_open_search"
- tapOn:
    id: "search_field"
- inputText: "kar"
- tapOn:
    id: "search_result"
    index: 0
- tapOn:
    id: "confirm_ack"
- tapOn:
    id: "confirm_continue"
- tapOn:
    id: "capture_accept"
- tapOn:
    id: "capture_ready"
- tapOn:
    id: "capture_shutter"
- tapOn:
    id: "capture_submit"
- assertVisible: "Attendance captured and queued"
- tapOn:
    id: "capture_done"

# Queue shows one pending item — capture succeeded, upload did not.
#
# The count comes from OfflineBar, which renders the number in a badge and the
# rest of the sentence separately, under `Semantics(excludeSemantics: true)`
# (bmd_feedback.dart:128-133). So there is no "1 pending" text anywhere — the
# old assertion here could never have passed — and no descendant identifier can
# be added either, because excludeSemantics drops the whole subtree. The one
# thing Maestro CAN see is the bar's own a11y label, which is asserted below.
# TESTING_MAESTRO.md §3.1 lists a `queue_pending_count` id for this; it does not
# exist and cannot be made to exist inside that subtree.
- tapOn:
    id: "dev_open_queue"
- assertVisible: "1 captures waiting to upload.*"
- assertVisible: "Pending sync"

# Durability: kill and relaunch WITHOUT clearing state; item must persist.
# Deliberately no `arguments:` — the previous ones were inert, and the relaunch
# reuses the same APK, so the configuration is unchanged by construction.
- stopApp
- launchApp
- tapOn:
    id: "dev_open_queue"
- assertVisible: "Pending sync"

# Reconnect -> engine auto-drains -> item moves to Match processing.
#
# The final assertion was "All items synced", which no screen renders, and the
# empty state it presumably meant ('Everything is synced') can never appear
# here: SyncEngineImpl._onSuccess sets the task's status to matchProcessing and
# leaves the ROW in place (sync_engine_impl.dart:130-136); only discard deletes.
# What actually reaches zero is the pending count, so that is what is asserted.
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Match processing"
    timeout: 20000
- extendedWaitUntil:
    visible: "0 captures waiting to upload.*"
    timeout: 10000
