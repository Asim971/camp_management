# P-04 Online attendance: search -> confirm -> capture -> quality pass -> queued.
# Prereqs: E2E build (fake camera + passing quality), seeded roster, mock upload.
#
# Requires the `field` matrix APK (E2E=true with the DEFAULT ROLE=field_user and
# QUALITY=pass). Configuration comes from the build: Maestro `arguments:` are
# Android intent extras and CANNOT reach `const String.fromEnvironment`.
# See ci.yml's e2e matrix. The mock server must be running — the upload leg is
# presign -> PUT -> confirm against tool/mock_server.
appId: ${APP_ID}
tags:
  - field
  - critical
  - android
  - pr-smoke
---
- runFlow: ../subflows/launch_as_field_user.yaml

- tapOn:
    id: "dev_open_search" # opens /search/SESSION_E2E
- assertVisible:
    id: "search_field" # label "Find carpenter", hint "At least 2 characters"
- tapOn:
    id: "search_field"
- inputText: "kar"
- assertVisible:
    id: "search_result"

# Select first match and clear the mandatory second identity cue.
- tapOn:
    id: "search_result"
    index: 0
- assertVisible:
    id: "confirm_continue"
- tapOn:
    id: "confirm_ack" # "I confirmed this is the correct carpenter"
- tapOn:
    id: "confirm_continue"

# Purpose notice -> positioning -> live camera.
- assertVisible: "Attendance photo and identity verification"
- tapOn:
    id: "capture_accept" # "Accept and continue"
- tapOn:
    id: "capture_ready" # "I'm ready"
- assertVisible:
    id: "capture_shutter"
- tapOn:
    id: "capture_shutter"

# Quality passes (E2E PassthroughQualityChecker) -> submit -> queued.
- assertVisible: "Capture looks good"
- tapOn:
    id: "capture_submit"
- assertVisible: "Attendance captured and queued"
- tapOn:
    id: "capture_done"
