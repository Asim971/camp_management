# W-06 registration workspace against the REAL campaign service (2a-I).
# Fixtures: POST /__test__/reset leaves campaign seed-camp-1 ("ACSL Pilot
# Carpenter Drive", APPROVED) and carpenters "Md. Karim" (••4821, id
# CARP_E2E) / "Karim Uddin" (••7734) -- see
# server/lib/src/seed/seed_routes.dart.
#
# Requires the `realAuth` matrix APK (--dart-define=E2E_REAL_AUTH=true,
# alongside the always-on --dart-define=E2E=true) -- see this flow's own
# `registration` matrix config in ci.yml and real_auth_campaign_journey.yaml's
# header comment for why real auth is needed at all.
appId: ${APP_ID}
tags:
  - registration
  - critical
  - android
---
- clearState
- launchApp

# Unauthenticated after the auto-sign-in's real 401 (see
# real_auth_campaign_journey.yaml's header comment for why): RouteGuards
# redirected `/dev` to `/login?from=%2Fdev`.
- assertVisible:
    id: "login_username"
- tapOn:
    id: "login_username"
- inputText: "campaign_creator"
- tapOn:
    id: "login_password"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "login_submit"

# A real JWT was issued and verified by `authenticate()` -- landed back on
# the dev launcher.
- assertVisible:
    id: "dev_launcher"
- tapOn:
    id: "dev_open_campaigns"

# One of `POST /__test__/reset`'s three seeded rows -- the seeded APPROVED
# campaign whose owner is campaign_creator, so its "Add registrations"
# button (Permission.campaignCreate) renders.
- assertVisible: ".*ACSL Pilot Carpenter Drive.*"
- tapOn: ".*ACSL Pilot Carpenter Drive.*"
- assertVisible: ".*ACSL Pilot Carpenter Drive.*"
- tapOn: "Add registrations"
- assertVisible: "Search carpenter master"

# Master search + basket (all ids are the Semantics identifiers Task 9
# adds to registration_workspace_screen.dart; CARP_E2E is the seeded
# fixture id for "Md. Karim"):
- tapOn:
    id: "registration_search"
- inputText: "Karim"

# Wrapped in `.*`: this ListTile's title (name) and subtitle (displayId ·
# territory · phone suffix) merge into one accessibility node, same as
# real_auth_campaign_journey.yaml's BmdDataTable-row idiom -- Maestro
# anchors bare text patterns, so an unwrapped "Md. Karim" fails to match
# "Md. Karim\nCARP-••4821 · Dhaka North · •4821" even though it's plainly
# visible on screen.
- assertVisible: ".*Md. Karim.*"
- assertVisible: ".*CARP-••4821.*"
- tapOn:
    id: "registration_add_CARP_E2E"

# Mobile layout (registration_workspace_screen.dart's non-desktop branch)
# stacks a 420px-tall search pane FIRST and the basket card BELOW it in one
# ListView -- and the keyboard raised by typing "Karim" is still up, further
# shrinking the visible viewport. assertVisible does not scroll, so a bare
# assert here fails exactly like crm_case_conflict.yaml's/crm_case_decision.yaml's
# below-the-fold cards.
#
# scrollUntilVisible (and plain scroll) swipe from screen CENTER, which lands
# inside the search pane's INNER ListView.separated (the 2-item results list,
# lines ~85-127) -- that list has no scroll extent of its own but on Android
# still CLAIMS the vertical drag (clamping physics, no bubbling to the outer
# ListView), so the outer list never moves and this timed out for 20s in CI
# with the basket still below the fold.
#
# Fix: coordinate `swipe` whose START point is NOT inside that inner list's
# hit-box. BmdSearchField + its persistent helper text (scopeLabel, lines
# ~72-77) is a plain Column child that sits ABOVE the Expanded results list,
# so a vertical drag starting there is claimed by the OUTER ListView instead.
# Two swipes for margin -- the outer list's scroll extent is small (just the
# 16px gap + basket Card), so extra swipes past the end are harmless clamps.
- hideKeyboard
- swipe:
    start: 50%, 30%
    end: 50%, 8%
- swipe:
    start: 50%, 30%
    end: 50%, 8%

# Maestro text patterns are ANCHORED REGEX, not literals -- we've been
# exploiting that everywhere with `.*` wraps, but it cuts both ways:
# parentheses are capture groups, not literal characters. The bare pattern
# "Registration basket (1)" actually matches the string "Registration
# basket 1" (no parens), which never appears on screen -- the real header
# text, parens and all, was rendered the whole time. Single-quoted YAML
# strings keep backslashes literal, so escape the parens: \( \).
- assertVisible: 'Registration basket \(1\)'

# registration_submit is in the same basket card just scrolled to, so it's
# already reachable. The "Registered 1 participant(s)" snackbar renders at
# the screen bottom regardless of scroll position. Same regex-parens fix as
# above: "(s)" is a capture group, so escape it too.
- tapOn:
    id: "registration_submit"
- assertVisible: 'Registered 1 participant\(s\)'

# Same-visit profile request lands in the basket: a search with no match
# surfaces the empty-state's "Request new profile" affordance.
#
# registration_search sits at the TOP of the same ListView, and registering
# didn't reset the scroll position (it only emptied the basket), so scroll
# back UP before returning to it -- otherwise this fails the same way in
# reverse.
#
# Same nested-scrollable hazard as the DOWN swipe above, mirrored: a drag
# starting at the coordinates the search-field zone occupied BEFORE scrolling
# (~30%) would, once scrolled down, now land over the search pane's inner
# results list again (that Expanded box's hit-area covers the full 332px it
# was given, including the empty space below the 2 rows -- not just where the
# rows are drawn) and get swallowed the same way. The basket Card below it
# (lines ~223-259) has no inner scrollable at all -- its rows come from a
# plain `for` loop straight in the Card's Column (line 241), not a nested
# ListView -- so anywhere on the lower part of the card is a safe start. Per
# the mobile layout's cumulative chrome (AppBar + breadcrumb + the 420px
# search pane + the card's own header), the card only starts appearing
# around ~65% of the screen once fully scrolled down, so start well past
# that, in the card's ListTile/button zone, and drag downward to reverse the
# scroll. Two swipes for margin, same as above.
- swipe:
    start: 50%, 75%
    end: 50%, 98%
- swipe:
    start: 50%, 75%
    end: 50%, 98%
- tapOn:
    id: "registration_search"
- inputText: "Nobody Matches This"
- assertVisible: "No matching carpenter in the master."
- tapOn:
    id: "registration_request_profile"
- tapOn:
    id: "profile_name"
- inputText: "Flow Person"
- tapOn:
    id: "profile_phone"
- inputText: "+8801799990001"
- hideKeyboard
- tapOn:
    id: "profile_submit"

# Back down to the basket card again -- same mobile-layout fold as above; the
# UP scroll before the no-match search left the ListView scrolled to the top,
# so the search-field-zone start point is safe again (same reasoning as the
# first DOWN swipe: it's above the inner results list, not inside it).
- swipe:
    start: 50%, 30%
    end: 50%, 8%
- swipe:
    start: 50%, 30%
    end: 50%, 8%

# Same regex-parens fix as the first basket assert above.
- assertVisible: 'Registration basket \(1\)'

# Same merged-node idiom as the search result above: the basket row is also
# a ListTile (title: name, subtitle: displayId), so wrap in `.*`.
- assertVisible: ".*Flow Person.*"
