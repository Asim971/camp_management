# W-06 registration workspace against the REAL campaign service (2a-I).
# Fixtures: POST /__test__/reset leaves campaign seed-camp-1 ("ACSL Pilot
# Carpenter Drive", APPROVED) and carpenters "Md. Karim" (••4821, id
# CARP_E2E) / "Karim Uddin" (••7734) -- see
# server/lib/src/seed/seed_routes.dart.
#
# Requires the `realAuth` matrix APK (--dart-define=E2E_REAL_AUTH=true,
# alongside the always-on --dart-define=E2E=true) -- see this flow's own
# `registration` matrix config in ci.yml and real_auth_campaign_journey.yaml's
# header comment for why real auth is needed at all.
appId: ${APP_ID}
tags:
  - registration
  - critical
  - android
---
- clearState
- launchApp

# Unauthenticated after the auto-sign-in's real 401 (see
# real_auth_campaign_journey.yaml's header comment for why): RouteGuards
# redirected `/dev` to `/login?from=%2Fdev`.
- assertVisible:
    id: "login_username"
- tapOn:
    id: "login_username"
- inputText: "campaign_creator"
- tapOn:
    id: "login_password"
- inputText: "Test1234!"
- hideKeyboard
- tapOn:
    id: "login_submit"

# A real JWT was issued and verified by `authenticate()` -- landed back on
# the dev launcher.
- assertVisible:
    id: "dev_launcher"
- tapOn:
    id: "dev_open_campaigns"

# One of `POST /__test__/reset`'s three seeded rows -- the seeded APPROVED
# campaign whose owner is campaign_creator, so its "Add registrations"
# button (Permission.campaignCreate) renders.
- assertVisible: ".*ACSL Pilot Carpenter Drive.*"
- tapOn: ".*ACSL Pilot Carpenter Drive.*"
- assertVisible: ".*ACSL Pilot Carpenter Drive.*"
- tapOn: "Add registrations"
- assertVisible: "Search carpenter master"

# Master search + basket (all ids are the Semantics identifiers Task 9
# adds to registration_workspace_screen.dart; CARP_E2E is the seeded
# fixture id for "Md. Karim").
#
# The mobile layout is now basket-first (basket card, then the 420px search
# pane, in registration_workspace_screen.dart's non-desktop ListView), so
# the "Registration basket (N)" header and "Register N participant(s)"
# button sit permanently top-of-screen with no scroll ever required. The
# search interactions below run while the basket is empty or holds just one
# row, so the search field/results/add-button/request-profile targets stay
# on-screen too, inside the fixed-height search pane. No swipe appears
# anywhere in this flow anymore.
- tapOn:
    id: "registration_search"
- inputText: "Karim"

# Wrapped in `.*`: this ListTile's title (name) and subtitle (displayId ·
# territory · phone suffix) merge into one accessibility node, same as
# real_auth_campaign_journey.yaml's BmdDataTable-row idiom -- Maestro
# anchors bare text patterns, so an unwrapped "Md. Karim" fails to match
# "Md. Karim\nCARP-••4821 · Dhaka North · •4821" even though it's plainly
# visible on screen.
- assertVisible: ".*Md. Karim.*"
- assertVisible: ".*CARP-••4821.*"
- tapOn:
    id: "registration_add_CARP_E2E"

# Mobile layout (registration_workspace_screen.dart's non-desktop branch) now
# stacks the basket card FIRST, with the 420px-tall search pane below it --
# so the basket header and the Register button are both permanently
# top-of-screen, above the bottom NavigationBar this route renders. No
# scroll is needed to reach either one; every swipe this flow used to need
# to fight the nested-scrollable/below-the-fold problem is gone.
- hideKeyboard

# Maestro text patterns are ANCHORED REGEX, not literals -- we've been
# exploiting that everywhere with `.*` wraps, but it cuts both ways:
# parentheses are capture groups, not literal characters. The bare pattern
# "Registration basket (1)" actually matches the string "Registration
# basket 1" (no parens), which never appears on screen -- the real header
# text, parens and all, was rendered the whole time. Single-quoted YAML
# strings keep backslashes literal, so escape the parens: \( \).
#
# Escaping alone still wasn't enough: the run's screen-hierarchy artifact
# showed the basket Card's whole subtree merges into ONE multi-line
# accessibility node ("Registration basket (1)\nMd. Karim\nCARP-••4821"),
# same as the ListTiles above. Maestro full-matches node text as regex, so
# an escaped-but-unwrapped pattern only matches when it equals the ENTIRE
# node text -- it must also be wrapped in `.*` to match as a substring
# across the \n boundaries, exactly like the ListTile asserts earlier in
# this flow. Both fixes are required together: escape literal metacharacters
# AND wrap for a partial, multi-line match.
- assertVisible: '.*Registration basket \(1\).*'

# Basket-first means the Register button (the card's bottom element) is on
# screen in the same fold as the header above -- no separate swipe needed to
# clear the bottom NavigationBar.
- tapOn:
    id: "registration_submit"

# Snackbar renders as a Scaffold overlay above the bottom nav bar,
# independent of the ListView's scroll offset -- same escape-and-wrap fix as
# above (wrapped here for uniformity/robustness even though a snackbar is a
# single-line, non-merged node).
- assertVisible: '.*Registered 1 participant\(s\).*'

# Same-visit profile request lands in the basket: a search with no match
# surfaces the empty-state's "Request new profile" affordance.
#
# registration_search sits BELOW the basket card in this basket-first
# layout, but the search field itself (plus the 2-row results list under
# it) fits within the 420px search pane the ListView allocates it, so it's
# still fully on-screen with no scroll needed -- registering only emptied
# the basket, it didn't move anything below the fold.
- tapOn:
    id: "registration_search"
- inputText: "Nobody Matches This"
- assertVisible: "No matching carpenter in the master."
- tapOn:
    id: "registration_request_profile"
- tapOn:
    id: "profile_name"
- inputText: "Flow Person"
- tapOn:
    id: "profile_phone"
- inputText: "+8801799990001"
- hideKeyboard
- tapOn:
    id: "profile_submit"

# Basket card again -- still the FIRST thing in the mobile ListView, so no
# scroll is needed to re-check it after the profile-request round trip.
#
# Same escape-and-wrap fix as the first basket assert above.
- assertVisible: '.*Registration basket \(1\).*'

# Same merged-node idiom as the search result above: the basket row is also
# a ListTile (title: name, subtitle: displayId), so wrap in `.*`.
- assertVisible: ".*Flow Person.*"
