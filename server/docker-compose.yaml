services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: campaign
      POSTGRES_DB: campaign
    ports:
      # Host 5433, not 5432: dev machines may run a native Postgres on 5432
      # (this repo's slice-1 execution did exactly that). The server container
      # reaches the db over the compose network as db:5432 either way; this
      # mapping exists only for host-side psql/debugging.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build:
      # Repo root, not server/: the Dockerfile copies the sibling
      # packages/campaign_contracts path dependency (see its header comment).
      context: ..
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://campaign:campaign@db:5432/campaign
      # Local/dev only. A real deploy injects its own secret; ServerConfig
      # rejects anything under 32 characters at boot.
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-at-least-32-chars!}
      # Fails closed: only the exact string "true" (e.g.
      # `ENABLE_TEST_SEEDING=true docker compose up`) mounts /__test__/*.
      ENABLE_TEST_SEEDING: ${ENABLE_TEST_SEEDING:-false}
    depends_on:
      db:
        condition: service_healthy
